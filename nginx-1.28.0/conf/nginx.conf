events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 性能优化
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/xml+rss image/svg+xml;
    gzip_min_length 1000;

    # 服务器配置
    server {
        listen       443 ssl http2;
        listen       [::]:443 ssl http2;
        server_name  your-domain.com;  # 替换为实际域名

        # SSL 证书配置（替换为实际证书路径）
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss:;" always;

        # 日志
        access_log  logs/access.log;
        error_log   logs/error.log;

        # 前端静态资源配置
        location / {
            root   /usr/share/nginx/html/dist;  # 修改为实际部署路径
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # 反向代理：转发API请求到后端
        location /check/ {
            proxy_pass http://localhost:8080/check/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Trace-Id $request_id;
            # 限流
            limit_req  zone=api_limit burst=20 nodelay;
            # 超时
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # WebSocket 代理
        location /ws/ {
            proxy_pass http://localhost:8080/check/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 错误页面配置
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

    # HTTP 重定向到 HTTPS
    server {
        listen       80;
        listen       [::]:80;
        server_name  your-domain.com;
        return 301 https://$host$request_uri;
    }

    # 限流区域定义
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
}